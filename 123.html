<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Booth</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, "Noto Sans SC", sans-serif;
            background-color: #f4f4f4;
            color: #222;
            margin: 0;
            padding: 0 0 84px;
        }
        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .camera-container {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 8px;
        }
        video {
            width: min(100%, 480px);
            aspect-ratio: 4 / 3;
            height: auto;
            background-color: #000;
            border: 2px solid #333;
            border-radius: 5px;
            transform: scaleX(-1);
        }
        .status, .photo-count {
            text-align: center;
            margin: 12px 16px 0;
            line-height: 1.5;
        }
        .status { min-height: 1.5em; }
        .photo-count { color: #555; }
        button {
            border: 0;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            padding: 10px 20px;
            font-size: 1rem;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: .55;
        }
        .capture-btn, .reset-btn {
            background-color: #007BFF;
            margin-top: 16px;
        }
        .capture-btn:hover:not(:disabled), .reset-btn:hover {
            background-color: #0056b3;
        }
        .preview-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 16px;
        }
        .preview-container img {
            width: min(150px, calc(50vw - 24px));
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
        }
        .action-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 0 16px 24px;
        }
        .download-btn { background-color: #28a745; }
        .download-btn:hover { background-color: #218838; }
        .reset-btn { margin-top: 0; }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        footer p { margin: 0; }
    </style>
</head>
<body>
<header>
    <h1>Photo Booth</h1>
    <p>拍摄四张照片，生成并下载竖版拼图</p>
</header>

<main>
    <div class="camera-container">
        <video id="video" autoplay playsinline aria-label="摄像头预览"></video>
        <p id="cameraStatus" class="status" role="status" aria-live="polite">正在请求摄像头权限…</p>
        <p id="photoCount" class="photo-count">已拍 0 / 4 张</p>
        <button id="captureButton" class="capture-btn" type="button" disabled>拍摄</button>
    </div>

    <div class="preview-container" id="previewContainer" aria-label="照片预览"></div>
    <div class="action-container" id="actionContainer"></div>
</main>

<footer>
    <p>Photo Booth</p>
</footer>

<script>
    const videoElement = document.getElementById("video");
    const cameraStatus = document.getElementById("cameraStatus");
    const photoCount = document.getElementById("photoCount");
    const captureButton = document.getElementById("captureButton");
    const previewContainer = document.getElementById("previewContainer");
    const actionContainer = document.getElementById("actionContainer");
    const constraints = { video: { facingMode: "user" }, audio: false };
    const capturedImages = [];
    let cameraStream = null;

    function setStatus(message) {
        cameraStatus.textContent = message;
    }

    function explainCameraError(error) {
        if (error.name === "NotAllowedError" || error.name === "PermissionDeniedError") {
            return "没有获得摄像头权限。请在浏览器的站点设置中允许访问摄像头后刷新页面。";
        }
        if (error.name === "NotFoundError" || error.name === "DevicesNotFoundError") {
            return "没有检测到可用摄像头。";
        }
        if (error.name === "NotReadableError" || error.name === "TrackStartError") {
            return "摄像头可能正被其他应用占用，请关闭占用摄像头的应用后重试。";
        }
        return "无法打开摄像头：" + (error.message || error.name || "未知错误");
    }

    async function startCamera() {
        captureButton.disabled = true;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setStatus("当前页面无法访问摄像头。请通过 localhost 或 HTTPS 打开。");
            return;
        }

        setStatus("正在连接摄像头，请在浏览器提示中允许访问。");
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = cameraStream;
            await videoElement.play();
            captureButton.disabled = false;
            setStatus("摄像头已就绪，可以开始拍摄。");
        } catch (error) {
            setStatus(explainCameraError(error));
        }
    }

    function stopCamera() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }
        videoElement.srcObject = null;
    }

    function capturePhoto() {
        if (!cameraStream || videoElement.videoWidth === 0 || capturedImages.length >= 4) {
            return;
        }

        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        canvas.width = videoElement.videoWidth;
        canvas.height = videoElement.videoHeight;

        // 保存的照片也采用镜像效果，与预览一致。
        context.translate(canvas.width, 0);
        context.scale(-1, 1);
        context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

        const imageUrl = canvas.toDataURL("image/png");
        capturedImages.push(imageUrl);

        const image = document.createElement("img");
        image.src = imageUrl;
        image.alt = "第 " + capturedImages.length + " 张照片";
        previewContainer.appendChild(image);
        photoCount.textContent = "已拍 " + capturedImages.length + " / 4 张";

        if (capturedImages.length === 4) {
            captureButton.disabled = true;
            setStatus("四张照片已拍好，正在生成拼图…");
            stopCamera();
            createCompositeImage();
        }
    }

    function loadImage(imageUrl) {
        return new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = () => reject(new Error("照片加载失败，请重新拍摄。"));
            image.src = imageUrl;
        });
    }

    async function createCompositeImage() {
        try {
            // 等四张图片全部加载后再绘制，避免异步加载顺序造成漏图。
            const images = await Promise.all(capturedImages.map(loadImage));
            const cellSize = 600;
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            canvas.width = cellSize;
            canvas.height = cellSize * images.length;

            images.forEach((image, index) => {
                const cropSize = Math.min(image.naturalWidth, image.naturalHeight);
                const cropX = (image.naturalWidth - cropSize) / 2;
                const cropY = (image.naturalHeight - cropSize) / 2;
                context.drawImage(
                    image,
                    cropX, cropY, cropSize, cropSize,
                    0, index * cellSize, cellSize, cellSize
                );
            });

            showDownloadButton(canvas.toDataURL("image/png"));
            setStatus("拼图已生成，可以下载或重新拍摄。");
        } catch (error) {
            setStatus(error.message || "生成拼图失败，请重新拍摄。");
            addResetButton();
        }
    }

    function showDownloadButton(imageUrl) {
        const downloadButton = document.createElement("button");
        downloadButton.type = "button";
        downloadButton.textContent = "下载拼图";
        downloadButton.className = "download-btn";
        downloadButton.addEventListener("click", () => {
            const link = document.createElement("a");
            link.href = imageUrl;
            link.download = "composite-photo.png";
            link.click();
        });
        actionContainer.appendChild(downloadButton);
        addResetButton();
    }

    function addResetButton() {
        if (actionContainer.querySelector(".reset-btn")) return;
        const resetButton = document.createElement("button");
        resetButton.type = "button";
        resetButton.textContent = "重新拍摄";
        resetButton.className = "reset-btn";
        resetButton.addEventListener("click", resetSession);
        actionContainer.appendChild(resetButton);
    }

    function resetSession() {
        stopCamera();
        capturedImages.length = 0;
        previewContainer.replaceChildren();
        actionContainer.replaceChildren();
        photoCount.textContent = "已拍 0 / 4 张";
        setStatus("正在重新启动摄像头…");
        startCamera();
    }

    captureButton.addEventListener("click", capturePhoto);
    window.addEventListener("load", startCamera);
    window.addEventListener("pagehide", stopCamera);
</script>
</body>
</html>
